# .github/workflows/make-reel.yml  (draft, not deployed)
# n8n starts this with POST /repos/{owner}/{repo}/actions/workflows/make-reel.yml/dispatches
# body: {"ref":"main","inputs":{"date":"2026-10-21","slides":"url1,url2,url3,url4"}}
# Free on a public repo. Holds no keys: slides arrive as public HCTI URLs.
name: make-reel
on:
  workflow_dispatch:
    inputs:
      date:   { description: "yyyy-MM-dd", required: true }
      slides: { description: "4 comma-separated 1080x1920 PNG URLs", required: true }
      music:  { description: "file in music/ (optional)", required: false, default: "" }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download slides
        run: |
          i=1; for u in $(echo "${{ inputs.slides }}" | tr ',' ' '); do curl -sSfL "$u" -o s$i.png; i=$((i+1)); done
      - name: Build MP4
        run: bash make_reel.sh "reels/${{ inputs.date }}.mp4" ${{ inputs.music && format('music/{0}', inputs.music) || '' }}
      - name: Publish (public raw URL)
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add reels/ && git commit -m "Reel ${{ inputs.date }}" && git push
          echo "URL: https://raw.githubusercontent.com/${{ github.repository }}/main/reels/${{ inputs.date }}.mp4"
