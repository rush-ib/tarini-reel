# n8n starts this with POST /repos/rush-ib/tarini-reel/actions/workflows/render.yml/dispatches
# First n8n (or you) saves the slides as jobs/<job_id>/slides.json, then dispatches with just: {"ref":"main","inputs":{"job_id":"2026-10-21-1729500000","mode":"reel"}}
# Output: out/<job_id>/s1.png… (+ reel.mp4) and out/<job_id>/result.json with public links.
# Free on a public repo. Holds no keys.
name: render
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "unique folder name, e.g. 2026-10-21-1729500000", required: true }
      mode:   { description: "reel or carousel", required: true, type: choice, options: [reel, carousel], default: reel }
      music:  { description: "file in music/ (optional, reel only)", required: false, default: "" }
      music_start: { description: "start the song at this time, e.g. 45 or 1:05 (optional)", required: false, default: "0" }
permissions:
  contents: write
concurrency: { group: render, cancel-in-progress: false }   # one push at a time
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_ID: ${{ inputs.job_id }}
      MODE: ${{ inputs.mode }}
      MUSIC: ${{ inputs.music }}
      MUSIC_START: ${{ inputs.music_start }}
    steps:
      - name: Check job_id
        run: '[[ "$JOB_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || { echo "job_id may only use letters, digits, - and _"; exit 1; }'
      - name: Check music_start
        run: '[[ "$MUSIC_START" =~ ^[0-9]{1,2}(:[0-9]{2})?(\.[0-9]+)?$ ]] || { echo "music_start must look like 45 or 1:05"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium
      - name: Install Playwright + Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install chromium   # skips the download on a cache hit
      - name: Install FFmpeg
        if: inputs.mode == 'reel'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ github.token }}
      - name: Render HTML to PNG
        run: node render.js || (npx playwright install-deps chromium && node render.js)   # system libraries only if Chrome fails to start
      - name: Build MP4
        if: inputs.mode == 'reel'
        run: |
          if [ -n "$MUSIC" ]; then bash make_reel.sh reel.mp4 "music/$MUSIC"; else bash make_reel.sh reel.mp4; fi
      - name: Save files and result.json
        run: |
          D="out/$JOB_ID"; mkdir -p "$D"; mv s*.png "$D/"; [ -f reel.mp4 ] && mv reel.mp4 "$D/"
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/main/$D"
          node -e '
            const fs=require("fs"), d=process.argv[1], base=process.argv[2];
            const files=fs.readdirSync(d);
            const images=files.filter(f=>/^s\d+\.png$/.test(f)).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))).map(f=>`${base}/${f}`);
            const video=files.includes("reel.mp4")?`${base}/reel.mp4`:null;
            fs.writeFileSync(`${d}/result.json`,JSON.stringify({job_id:process.env.JOB_ID,mode:process.env.MODE,images,video,run_id:"${{ github.run_id }}"},null,2));
          ' "$D" "$BASE"
          cat "$D/result.json"
      - name: Commit and push
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add out/ && git commit -m "Render $JOB_ID ($MODE)"
          git checkout -- .   # drop the temporary s*.png changes in the repo root
          git pull --rebase origin main && git push origin HEAD:main
